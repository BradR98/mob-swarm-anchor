<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Mob Swarm Anchor Edition</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b1020; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 360px; height: 640px; }
/* Logical Game Canvas */
  #game {
    position: absolute; left: 50%; bottom: 0;
    transform-origin: 50% 100%; z-index: 1;
    background-color: transparent;
    pointer-events: none; display: block;
  }
  
  #ui-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
    pointer-events: none; box-sizing: border-box; padding: 14px;
  }
  #ui-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: none; }
  #ui-banner { display: none; font-weight: 900; font-size: 30px; letter-spacing: 2px; color: #7dff9a; text-shadow: 0 3px 10px rgba(0,0,0,0.7); text-align: center; }
  .ui-btn { display: none; pointer-events: auto; cursor: pointer; font: 800 22px system-ui, sans-serif; color: #0b1020; background: #7dff9a; border: none; border-radius: 14px; padding: 16px 38px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .ui-btn:active { transform: scale(0.96); }
  #ui-level { position: absolute; top: 16px; left: 72px; font-weight: 800; font-size: 11px; color: rgba(255,255,255,0.85); text-align: left; }
  #ui-hp-wrapper { position: absolute; top: 14px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
  #ui-hp-text { display: none; font-weight: 700; font-size: 16px; color: #fff; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  #ui-flash { position: absolute; inset: 0; background: rgb(255,40,60); opacity: 0; }
  #ui-power { position: absolute; top: 40px; right: 14px; font-weight: 800; font-size: 13px; color: #ffd36a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="ui-overlay">
      <div id="ui-flash"></div>
      <div id="ui-power"></div>
      <div id="ui-center"><div id="ui-banner">LEVEL COMPLETE</div><button id="ui-start" class="ui-btn" type="button">Start Game</button></div>
      <div id="ui-level">LEVEL 1 / 100</div>
      <div id="ui-hp-wrapper">
        <div id="ui-hp-text">250 HP</div>
      </div>
    </div>

  </div>
</div>
<script type="module">
  import { AnchorLoop, State } from './lib/anchor-loop.js';
  import { AnchorInput } from './lib/anchor-input.js';
  import { createGame } from './src/mob-swarm.js';
  import { createAudio } from './lib/anchor-audio.js';
  import { createControls } from './lib/anchor-ui.js';

  const W = 360, H = 640;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  

  // Resize scaling
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    stage.style.width = cw + 'px';
    stage.style.height = ch + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const TRACK_Y = 640 * 0.85; // Cannon Y
    const BASE_Y = 52;
    const HUD_TOP = 58;
    const BASE_H = 64;
    const BASE_BOTTOM = BASE_Y + BASE_H;
    
    // Exact 3D math from v18
    const TILT = 45, PERSP = 800, MAX_STRETCH = 1.9, WORLD_TOP = BASE_Y;
    const k = cw / W, wh = TRACK_Y - WORLD_TOP, th = TILT * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th), P = PERSP;
    const want = TRACK_Y - (HUD_TOP + BASE_H);
    let stretch = 1;
    if (TILT > 0) { const den = P * cs - want * sn; stretch = den > 1 ? want * P / den / wh : MAX_STRETCH; stretch = stretch < 1 ? 1 : (stretch > MAX_STRETCH ? MAX_STRETCH : stretch); }
    const hl = wh * stretch;

    canvas.style.width = cw + 'px'; canvas.style.height = (hl * k) + 'px'; canvas.style.bottom = ((H - TRACK_Y) * k) + 'px';
    canvas.style.transform = 'translateX(-50%) perspective(' + (P * k) + 'px) rotateX(' + TILT + 'deg)';
    
    canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(hl * k * dpr);
    ctxGame.setTransform(canvas.width / W, 0, 0, canvas.height / wh, 0, -WORLD_TOP * canvas.height / wh);
    
    // We update scaling dynamically inside the app if needed, but passing dpr scale is enough here.
    return { cw, ch, hl, k, dpr, wh, WORLD_TOP };
  }
  
  const ctxGame = canvas.getContext('2d');
  const dim = resize();
  window.addEventListener('resize', () => resize());
  

  // Bind Anchor libraries
  const input = new AnchorInput({ container: stage, width: W, height: H, steerFrac: 0.15, relative: false });
  
  
  const audio = createAudio();
  
  let loop;

  const game = createGame({ 
    input, 
    loop: { 
      levelClear: () => loop && loop.levelClear(), 
      gameOver: () => loop && loop.gameOver() 
    },
    ctxGame,
    startLevel: parseInt(new URLSearchParams(location.search).get('level'), 10) || 0
  });

  const loopRef = { get state() { return loop ? loop.state : State.START; }, togglePause: () => loop && loop.togglePause() };
  const ui = createControls({ stage, loop: loopRef, audio });
  loop = new AnchorLoop({
    update: (dt) => game.update(dt),
    draw: (alpha) => game.draw(alpha),
    maxDt: 1/20,
    onState: (next, prev) => {
      ui.sync();
      if (next === State.LEVEL_CLEAR) showBanner('LEVEL COMPLETE', 2000);
      else if (next === State.GAMEOVER) showBanner('DEFEAT', 1500);
    }
  });

  // READY / TRANSITION flow (flat DOM overlay, never inside the tilted canvas)
  const startBtn = document.getElementById('ui-start'), banner = document.getElementById('ui-banner');
  function showReady() {
    startBtn.textContent = game.getLevel() > 1 ? "Let's Go" : 'Start Game';
    startBtn.style.display = 'block';
  }
  function showBanner(text, ms) {
    banner.textContent = text; banner.style.display = 'block';
    setTimeout(() => {
      banner.style.display = 'none';
      game.restart();   // win: next level, loss: same level; either way the new level loads in READY
      showReady();
    }, ms);
  }
  startBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startBtn.style.display = 'none';
    game.begin();
    loop.start();
  });

  if (location.hash === '#boss') setTimeout(() => game.forceBoss(), 300);
  loop.boot();   // START: draw() only, update() is bypassed until the button is pressed
  showReady();
</script>
<script id="sw-register">
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;
      reloading = true; location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        function activate(w) { if (w) w.postMessage('SKIP_WAITING'); }
        activate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) activate(w); });
        });
        reg.update();
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
      }).catch(function () {});
    });
  }
</script>
</body></html>
